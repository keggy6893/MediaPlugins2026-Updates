name: Build and publish r20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-r20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 2026.1-r20
      BUILD: '2026091501'
      PACKAGE: enigma2-plugin-extensions-mediaplugins2026
      R19_SHA256: e7c42839b3bcf96d922cd9b9f463517751619c2fe96c84aa50fc31a4d0e63edb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build r20 from confirmed r19
        shell: bash
        run: |
          set -euo pipefail
          R19="${PACKAGE}_2026.1-r19_all.ipk"
          OUT="${PACKAGE}_${VERSION}_all.ipk"
          ROOT="$PWD/build/data/usr/lib/enigma2/python/Plugins/Extensions/MediaPlugins2026"

          curl -fL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/2026.1-r19/${R19}" \
            -o "$R19"
          echo "${R19_SHA256}  ${R19}" | sha256sum -c -

          rm -rf build
          mkdir -p build/work build/control build/data
          cd build/work
          ar x "../../${R19}"
          cd ../control
          tar -xzf ../work/control.tar.gz
          cd ../data
          tar -xzf ../work/data.tar.gz
          cd "$GITHUB_WORKSPACE"

          # Auf der Testbox bestätigte Post-r19-Fixes in derselben Reihenfolge.
          python development/2026-09-14/MediaPlugins2026_LATEST_POSTERFIX1_patcher.py "$ROOT"
          python development/2026-09-14/MediaPlugins2026_AUTOBACKUP1_patcher.py "$ROOT"
          python development/2026-09-14/MediaPlugins2026_BACKUPCARD_UI1_FIXED.py "$ROOT"
          python development/2026-09-14/MediaPlugins2026_ICONALIGN_PROVIDERICONS1_FIXED.py "$ROOT"
          python development/2026-09-14/MediaPlugins2026_PROVIDERICON_POLISH1_patcher.py "$ROOT"
          python development/2026-09-14/MediaPlugins2026_PROVIDERICON_VISIBLE1_patcher.py "$ROOT"
          python development/2026-09-14/MediaPlugins2026_BACKUP_RESTORE_FINAL1_patcher.py "$ROOT"

          find "$ROOT" -type f \( -name '*.before_*' -o -name '*.pyc' -o -name '*.bak' -o -name '*~' \) -delete
          find "$ROOT" -type d -name '__pycache__' -prune -exec rm -rf {} +

          python - <<'PY'
          from pathlib import Path
          import os, re

          version = os.environ['VERSION']
          build = os.environ['BUILD']
          root = Path('build/data/usr/lib/enigma2/python/Plugins/Extensions/MediaPlugins2026')

          version_py = root / 'version.py'
          s = version_py.read_text(encoding='utf-8')
          s, n1 = re.subn(r'PLUGIN_VERSION\s*=\s*"[^"]+"', f'PLUGIN_VERSION = "{version}"', s, count=1)
          s, n2 = re.subn(r'PLUGIN_UPDATE_BUILD\s*=\s*\d+', f'PLUGIN_UPDATE_BUILD = {build}', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('version.py Version/Build konnte nicht gesetzt werden')
          version_py.write_text(s, encoding='utf-8')

          control = Path('build/control/control')
          cs = control.read_text(encoding='utf-8')
          cs, n = re.subn(r'(?m)^Version:\s*\S+', f'Version: {version}', cs, count=1)
          if n != 1:
              raise SystemExit('control Version konnte nicht gesetzt werden')
          control.write_text(cs, encoding='utf-8')

          checked = 0
          for py in root.rglob('*.py'):
              compile(py.read_text(encoding='utf-8'), str(py), 'exec')
              checked += 1
          print('Python-Dateien geprüft:', checked)

          home = (root / 'screens/HomeScreen.py').read_text(encoding='utf-8')
          settings = (root / 'screens/Settings.py').read_text(encoding='utf-8')
          backup_screen = (root / 'screens/BackupScreen.py').read_text(encoding='utf-8')
          helper = (root / 'utils/config_backup.py').read_text(encoding='utf-8')
          jf = (root / 'backends/jellyfin_client.py').read_text(encoding='utf-8')
          plex = (root / 'backends/plex_client.py').read_text(encoding='utf-8')

          required = {
              'Emby Poster-Fallback': 'MEDIAPLUGINS2026_LATEST_POSTERFIX1_EMBY' in jf,
              'Plex Poster-Fallback': 'MEDIAPLUGINS2026_LATEST_POSTERFIX1_PLEX' in plex,
              'Home Poster-Prefetch': 'MEDIAPLUGINS2026_LATEST_POSTERFIX1_HOME' in home,
              'AutoBackup': 'MEDIAPLUGINS2026_AUTOBACKUP1_SETTINGS' in settings,
              'Backup-Karte': 'MEDIAPLUGINS2026_BACKUPCARD_UI1' in settings,
              'Provider-Icons': 'MEDIAPLUGINS2026_PROVIDERICON_VISIBLE1' in settings,
              'Finale Backup/Restore-UI': 'MEDIAPLUGINS2026_BACKUP_RESTORE_FINAL1_SETTINGS' in settings,
              'Finaler Dialogtitel': 'Sicherung & Wiederherstellung' in backup_screen,
              'Restore im Dialog': '"blue": self.doImport' in backup_screen,
              'Blau aus Hauptscreen entfernt': 'name="key_blue"' not in settings,
              '7-Tage-Sicherung': 'AUTO_BACKUP_KEEP = 7' in helper,
              'Manuelle Tages-Sicherung': 'def force_backup_now()' in helper,
              'Emby-Icon vorhanden': (root / 'skin/icons/provider_emby.png').is_file(),
              'Plex-Icon vorhanden': (root / 'skin/icons/provider_plex.png').is_file(),
              'Backup-Icon vorhanden': (root / 'skin/icons/backup_database.png').is_file(),
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit('r20 Verifikation fehlgeschlagen: %r' % missing)

          bad = [p for p in root.rglob('*') if p.is_file() and (
              p.suffix == '.pyc' or '.before_' in p.name or p.name.endswith('.bak')
          )]
          if bad:
              raise SystemExit('Paket-Hygiene fehlgeschlagen: %r' % [str(x) for x in bad])
          PY

          printf '2.0\n' > build/debian-binary
          GZIP=-n tar --owner=0 --group=0 -czf build/control.tar.gz -C build/control .
          GZIP=-n tar --owner=0 --group=0 -czf build/data.tar.gz -C build/data .
          rm -f "$OUT"
          ar r "$OUT" build/debian-binary build/control.tar.gz build/data.tar.gz

          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "R20_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "R20_IPK=$OUT" >> "$GITHUB_ENV"
          echo "Built $OUT sha256=$SHA"

      - name: Verify packaged IPK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir -p verify/control verify/data
          cd verify
          ar x "../${R20_IPK}"
          tar -xzf control.tar.gz -C control
          tar -xzf data.tar.gz -C data
          ROOT="data/usr/lib/enigma2/python/Plugins/Extensions/MediaPlugins2026"
          grep -q '^Package: enigma2-plugin-extensions-mediaplugins2026$' control/control
          grep -q '^Version: 2026.1-r20$' control/control
          grep -q 'PLUGIN_VERSION = "2026.1-r20"' "$ROOT/version.py"
          grep -q 'Sicherung & Wiederherstellung' "$ROOT/screens/BackupScreen.py"
          test -f "$ROOT/skin/icons/provider_emby.png"
          test -f "$ROOT/skin/icons/provider_plex.png"
          test -f "$ROOT/skin/icons/backup_database.png"
          ! find data -type f -name '*.pyc' | grep -q .
          ! find data -type f -name '*.before_*' | grep -q .

      - name: Publish GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$'Media Plugins 2026 — 2026.1-r20\n\nBestätigter Post-r19-Stand:\n\n- leere Emby/Plex-Poster in „Neu hinzugefügt“ behoben\n- automatische tägliche Konfigurationssicherung mit 7-Tage-Rotation\n- sichtbare Sicherungen-Karte im Settings-Screen\n- Emby/Plex Provider-Icons und finaler UI-Polish\n- Sicherung & Wiederherstellung: GRÜN sichern, GELB exportieren, BLAU importieren, ROT abbrechen\n- Import aus dem Hauptscreen in den Sicherungsdialog verschoben\n- bestehender r19-Funktionsumfang bleibt erhalten\n- Paket ohne Backup-/pyc-Dateien\n\nSHA256: '"${R20_SHA256}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$R20_IPK" --clobber
          else
            gh release create "$VERSION" "$R20_IPK" \
              --title "Media Plugins 2026 — $VERSION" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

      - name: Publish stable r20 manifest and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          version = os.environ['VERSION']
          build = int(os.environ['BUILD'])
          package = os.environ['PACKAGE']
          sha = os.environ['R20_SHA256']
          filename = os.environ['R20_IPK']
          repo = os.environ['GITHUB_REPOSITORY']
          download = f'https://github.com/{repo}/releases/download/{version}/{filename}'

          manifest = {
              'version': version,
              'build': build,
              'channel': 'stable',
              'download': download,
              'sha256': sha,
              'artifact_type': 'ipk',
              'package': package,
              'changelog': [
                  'Poster-Fallbacks fuer Emby und Plex in Neu hinzugefuegt',
                  'Automatische taegliche Sicherung mit 7-Tage-Rotation',
                  'Sichtbare Sicherungen-Karte in den Einstellungen',
                  'Emby/Plex Provider-Icons und UI-Polish',
                  'Sicherung & Wiederherstellung mit Export und Import',
                  'Import aus Hauptscreen in Sicherungsdialog verschoben',
              ],
          }
          Path('update.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          marker = '## 2026.1-r19\n'
          if marker not in r:
              raise SystemExit('README r19 Anker fehlt')
          section = f'''## 2026.1-r20\n\nDer stabile r20-Stand ergänzt r19 um:\n\n- Poster-Fallbacks für Emby/Plex in „Neu hinzugefügt“\n- automatische tägliche Konfigurationssicherung mit 7-Tage-Rotation\n- sichtbare Sicherungen-Karte im Settings-Screen\n- Emby/Plex Provider-Icons\n- zentralen Dialog **Sicherung & Wiederherstellung** mit Sichern, Export und Import\n\nRelease-IPK: `{filename}`\n\nSHA256: `{sha}`\n\n'''
          readme.write_text(r.replace(marker, section + marker, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          marker = '## 2026.1-r19\n'
          if marker not in c:
              raise SystemExit('CHANGELOG r19 Anker fehlt')
          section = f'''## 2026.1-r20\n\nStabiler Release des auf der Testbox bestätigten Post-r19-Stands.\n\n### Neu und bestätigt\n\n- leere Poster in „Neu hinzugefügt“ für Emby/Plex behoben\n- tägliche Auto-Sicherung mit 7-Tage-Rotation und privaten Dateirechten\n- sichtbare Sicherungen-Karte mit Status und Verlauf\n- Emby/Plex Provider-Icons in Serverkarten und Detailbereich\n- zentraler Dialog „Sicherung & Wiederherstellung“\n- GRÜN: heutige Sicherung aktualisieren, GELB: Export, BLAU: Import/Restore, ROT: Abbrechen\n- Import aus dem Settings-Hauptscreen entfernt und logisch in den Sicherungsdialog verschoben\n- Paket-Hygiene geprüft: keine Backups oder `.pyc`-Dateien\n\nIPK: `{filename}`\n\nSHA256: `{sha}`\n\n'''
          changelog.write_text(c.replace(marker, section + marker, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json README.md CHANGELOG.md
          git commit -m 'Publish Media Plugins 2026 r20 stable manifest'
          git push origin HEAD:main
