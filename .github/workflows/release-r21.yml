name: Build and publish r21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-r21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 2026.1-r21
      BUILD: '2026091502'
      PACKAGE: enigma2-plugin-extensions-mediaplugins2026
      R20_SHA256: 79691535ad537029fed97331eb7c1c94cbd02256d1840c60ac76bffe41df611f

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build r21 from confirmed r20
        shell: bash
        run: |
          set -euo pipefail
          R20="${PACKAGE}_2026.1-r20_all.ipk"
          OUT="${PACKAGE}_${VERSION}_all.ipk"
          ROOT="$PWD/build/data/usr/lib/enigma2/python/Plugins/Extensions/MediaPlugins2026"

          curl -fL "https://github.com/${GITHUB_REPOSITORY}/releases/download/2026.1-r20/${R20}" -o "${R20}"
          echo "${R20_SHA256}  ${R20}" | sha256sum -c -

          rm -rf build
          mkdir -p build/work build/control build/data
          cd build/work
          ar x "../../${R20}"
          cd ../control
          tar -xzf ../work/control.tar.gz
          cd ../data
          tar -xzf ../work/data.tar.gz
          cd "$GITHUB_WORKSPACE"

          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = Path('development/2026-09-15/r21_patch_core.b64').read_text(encoding='utf-8').strip()
          Path('/tmp/mediaplugins2026_r21_patch.py').write_bytes(
              zlib.decompress(base64.b64decode(payload))
          )
          PY

          python /tmp/mediaplugins2026_r21_patch.py "$ROOT"

          find "$ROOT" -type f \( -name '*.before_*' -o -name '*.pyc' -o -name '*.bak' -o -name '*~' \) -delete
          find "$ROOT" -type d -name '__pycache__' -prune -exec rm -rf {} +

          python - <<'PY'
          from pathlib import Path
          import os, re

          version = os.environ['VERSION']
          build = os.environ['BUILD']
          root = Path('build/data/usr/lib/enigma2/python/Plugins/Extensions/MediaPlugins2026')

          version_py = root / 'version.py'
          s = version_py.read_text(encoding='utf-8')
          s, n1 = re.subn(r'PLUGIN_VERSION\s*=\s*"[^"]+"', f'PLUGIN_VERSION = "{version}"', s, count=1)
          s, n2 = re.subn(r'PLUGIN_UPDATE_BUILD\s*=\s*\d+', f'PLUGIN_UPDATE_BUILD = {build}', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('version.py Version/Build konnte nicht gesetzt werden')
          version_py.write_text(s, encoding='utf-8')

          control = Path('build/control/control')
          cs = control.read_text(encoding='utf-8')
          cs, n = re.subn(r'(?m)^Version:\s*\S+', f'Version: {version}', cs, count=1)
          if n != 1:
              raise SystemExit('control Version konnte nicht gesetzt werden')
          control.write_text(cs, encoding='utf-8')

          checked = 0
          for py in root.rglob('*.py'):
              compile(py.read_text(encoding='utf-8'), str(py), 'exec')
              checked += 1
          print('Python-Dateien geprüft:', checked)

          home = (root / 'screens/HomeScreen.py').read_text(encoding='utf-8')
          cache = (root / 'utils/image_cache.py').read_text(encoding='utf-8')
          http = (root / 'backends/http_helper.py').read_text(encoding='utf-8')
          backup_screen = (root / 'screens/BackupScreen.py').read_text(encoding='utf-8')

          required = {
              'r21 Home marker': 'MEDIAPLUGINS2026_POSTER_PIPELINE_R21_HOME' in home,
              'r21 Cache marker': 'MEDIAPLUGINS2026_POSTER_PIPELINE_R21_CACHE' in cache,
              'Cold-Boot Repair': 'POSTER_REPAIR' in home,
              'Generation Guard': 'STALE_CALLBACK' in home,
              'Async Runtime State': 'def _ensureHomeAsyncRuntimeState(self):' in home,
              'Interner Cache': 'CACHE_DIR = "/etc/enigma2/mediaplugins2026/poster_cache"' in cache,
              '12 MiB Limit': 'PERSISTENT_CACHE_MAX_BYTES = 12 * 1024 * 1024' in cache,
              '120 Dateien Limit': 'PERSISTENT_CACHE_MAX_FILES = 120' in cache,
              '14 Tage Limit': 'CACHE_MAX_AGE_DAYS = 14' in cache,
              'Atomic Write': 'os.replace(tmp_path, local_path)' in cache,
              'Cache Singleton': 'image_cache = ImageCache()' in cache,
              'Token Redaction': 'MEDIAPLUGINS2026_HTTP_LOG_REDACT1' in http,
              'Backup/Restore r20 bleibt': 'Sicherung & Wiederherstellung' in backup_screen,
              'Provider Icons r20 bleiben': (root / 'skin/icons/provider_emby.png').is_file() and (root / 'skin/icons/provider_plex.png').is_file(),
              'Dunkler Poster-Fallback': (root / 'skin/icons/poster_placeholder.png').is_file(),
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit('r21 Verifikation fehlgeschlagen: %r' % missing)

          if '/media/hdd' in cache or '/media/usb' in cache:
              raise SystemExit('r21 Cache darf keine HDD/USB-Abhaengigkeit enthalten')

          bad = [p for p in root.rglob('*') if p.is_file() and (
              p.suffix == '.pyc' or '.before_' in p.name or p.name.endswith('.bak')
          )]
          if bad:
              raise SystemExit('Paket-Hygiene fehlgeschlagen: %r' % [str(x) for x in bad])
          PY

          printf '2.0\n' > build/debian-binary
          GZIP=-n tar --owner=0 --group=0 -czf build/control.tar.gz -C build/control .
          GZIP=-n tar --owner=0 --group=0 -czf build/data.tar.gz -C build/data .
          rm -f "$OUT"
          ar r "$OUT" build/debian-binary build/control.tar.gz build/data.tar.gz

          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "R21_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "R21_IPK=$OUT" >> "$GITHUB_ENV"
          echo "Built $OUT sha256=$SHA"

      - name: Verify packaged IPK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir -p verify/control verify/data
          cd verify
          ar x "../${R21_IPK}"
          tar -xzf control.tar.gz -C control
          tar -xzf data.tar.gz -C data
          ROOT="data/usr/lib/enigma2/python/Plugins/Extensions/MediaPlugins2026"
          grep -q '^Package: enigma2-plugin-extensions-mediaplugins2026$' control/control
          grep -q '^Version: 2026.1-r21$' control/control
          grep -q 'PLUGIN_VERSION = "2026.1-r21"' "$ROOT/version.py"
          grep -q 'MEDIAPLUGINS2026_POSTER_PIPELINE_R21_HOME' "$ROOT/screens/HomeScreen.py"
          grep -q 'MEDIAPLUGINS2026_POSTER_PIPELINE_R21_CACHE' "$ROOT/utils/image_cache.py"
          grep -q 'CACHE_DIR = "/etc/enigma2/mediaplugins2026/poster_cache"' "$ROOT/utils/image_cache.py"
          grep -q 'MEDIAPLUGINS2026_HTTP_LOG_REDACT1' "$ROOT/backends/http_helper.py"
          test -f "$ROOT/skin/icons/poster_placeholder.png"
          ! grep -q '/media/hdd\|/media/usb' "$ROOT/utils/image_cache.py"
          ! find data -type f -name '*.pyc' | grep -q .
          ! find data -type f -name '*.before_*' | grep -q .

      - name: Publish GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$'Media Plugins 2026 — 2026.1-r21\n\nPoster-Pipeline Hotfix:\n\n- Reboot-sicherer persistenter Poster-Cache intern unter /etc/enigma2/mediaplugins2026/poster_cache\n- keine HDD-/USB-Abhängigkeit\n- Cache-Limits 12 MiB / 120 Dateien / 14 Tage\n- Bildvalidierung und atomische Cache-Schreibvorgänge\n- Retry bei transienten Poster-Downloads\n- Schutz vor stale asynchronen Poster-Callbacks\n- automatische Cold-Boot-Reparatur sichtbarer Poster\n- Preview-/Ambient-Async-State abgesichert\n- dunkler Poster-Fallback\n- sensible Token/API-Key Queryparameter werden im HTTP-Debuglog geschwärzt\n- bestehender r20-Funktionsumfang bleibt erhalten\n\nSHA256: '"${R21_SHA256}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$R21_IPK" --clobber
          else
            gh release create "$VERSION" "$R21_IPK" --title "Media Plugins 2026 — $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

      - name: Publish stable r21 manifest and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          version = os.environ['VERSION']
          build = int(os.environ['BUILD'])
          package = os.environ['PACKAGE']
          sha = os.environ['R21_SHA256']
          filename = os.environ['R21_IPK']
          repo = os.environ['GITHUB_REPOSITORY']
          download = f'https://github.com/{repo}/releases/download/{version}/{filename}'

          manifest = {
              'version': version,
              'build': build,
              'channel': 'stable',
              'download': download,
              'sha256': sha,
              'artifact_type': 'ipk',
              'package': package,
              'changelog': [
                  'Reboot-sichere Poster-Pipeline mit persistentem internem Cache',
                  'Keine HDD-/USB-Abhaengigkeit fuer Poster',
                  'Cache-Validierung, Atomic Write und Retry',
                  'Cold-Boot-Reparatur und Schutz vor stale Poster-Callbacks',
                  'Preview-/Ambient-Async-State abgesichert',
                  'Token und API-Keys im HTTP-Debuglog geschwaerzt',
              ],
          }
          Path('update.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          if '## 2026.1-r21\n' not in r:
              marker = '## 2026.1-r20\n'
              if marker not in r:
                  raise SystemExit('README r20 Anker fehlt')
              section = f'''## 2026.1-r21\n\nDer stabile r21-Hotfix härtet die Poster-Pipeline nach Reboots:\n\n- persistenter interner Poster-Cache ohne HDD/USB-Abhängigkeit\n- Cache-Validierung, atomische Writes und Retry\n- Cold-Boot-Reparatur und Schutz vor verspäteten Callbacks\n- abgesicherter Preview-/Ambient-State\n- dunkler Poster-Fallback\n- HTTP-Debuglogs schwärzen Token/API-Keys\n\nRelease-IPK: `{filename}`\n\nSHA256: `{sha}`\n\n'''
              readme.write_text(r.replace(marker, section + marker, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          if '## 2026.1-r21\n' not in c:
              marker = '## 2026.1-r20\n'
              if marker not in c:
                  raise SystemExit('CHANGELOG r20 Anker fehlt')
              section = f'''## 2026.1-r21\n\nStabiler Poster-Pipeline-Hotfix auf Basis von r20.\n\n### Neu und bestätigt\n\n- Poster bleiben nach vollständigem Reboot verfügbar\n- persistenter Cache unter `/etc/enigma2/mediaplugins2026/poster_cache`\n- keine HDD-/USB-Abhängigkeit\n- harte Cache-Grenzen: 12 MiB / 120 Dateien / 14 Tage\n- Bildvalidierung, atomische Writes und ein Retry bei transienten Fehlern\n- Generation Guard gegen verspätete asynchrone Poster-Callbacks\n- automatische Cold-Boot-Reparatur sichtbarer Poster\n- Preview-/Ambient-Async-State defensiv abgesichert\n- dunkler Poster-Fallback\n- sensible Token/API-Key-Parameter werden in HTTP-Debuglogs geschwärzt\n- r20-Funktionsumfang bleibt erhalten\n\nIPK: `{filename}`\n\nSHA256: `{sha}`\n\n'''
              changelog.write_text(c.replace(marker, section + marker, 1), encoding='utf-8')

          dev = Path('development/2026-09-15/README.md')
          if dev.exists():
              d = dev.read_text(encoding='utf-8')
              old = '## Release-Hinweis\n\nDer stabile Update-Kanal bleibt unverändert. Dieser Commit dokumentiert den bestätigten Entwicklungsfix; `update.json` wurde **nicht** auf eine neue Version angehoben.\n'
              new = '## Release-Hinweis\n\nDer bestätigte Poster-Pipeline-Fix wurde mit **2026.1-r21** in den stabilen Update-Kanal übernommen. Andere Nutzer erhalten ihn über den integrierten Media Plugins 2026 Updater.\n'
              if old in d:
                  dev.write_text(d.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json README.md CHANGELOG.md development/2026-09-15/README.md
          if git diff --cached --quiet; then
            echo "Manifest/docs bereits aktuell"
          else
            git commit -m 'Publish Media Plugins 2026 r21 stable manifest'
            git push origin HEAD:main
          fi
